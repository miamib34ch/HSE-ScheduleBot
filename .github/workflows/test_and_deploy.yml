name: Test and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unittests
        run: |
          PYTHONPATH=bot python -m unittest discover -s bot/tests

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker CLI
        uses: docker/setup-buildx-action@v2

      - name: Deploy via SSH with docker context
        env:
          INPUT_SSH_KEY: ${{ secrets.SSH_KEY }}
          INPUT_SSH_USER: ${{ secrets.SSH_USER }}
          INPUT_SSH_HOST: ${{ secrets.SSH_HOST }}
          INPUT_SSH_PORT: '22'
          INPUT_BUILD: 'true'
          INPUT_FORCE_RECREATE: 'true'
          INPUT_COMPOSE_FILE: 'docker-compose.yml'
        run: |
          if [ "$INPUT_BUILD" = 'true' ]; then
            BUILD_FLAG='--build'
          else
            BUILD_FLAG=''
          fi

          if [ "$INPUT_FORCE_RECREATE" = 'true' ]; then
            FORCE_RECREATE_FLAG='--force-recreate'
          else
            FORCE_RECREATE_FLAG=''
          fi

          mkdir -p $HOME/.ssh
          printf '%s\n' "$INPUT_SSH_KEY" > "$HOME/.ssh/private_key"
          chmod 600 "$HOME/.ssh/private_key"
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/private_key"

          docker context create remote --docker "host=ssh://$INPUT_SSH_USER@$INPUT_SSH_HOST:$INPUT_SSH_PORT" || true
          docker context use remote

          docker compose -f "$INPUT_COMPOSE_FILE" up -d $BUILD_FLAG $FORCE_RECREATE_FLAG $INPUT_OPTIONS $INPUT_SERVICE

          docker context use default
          docker context rm remote || true